<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Sell Trade</title>
  <script defer src="/scripts.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-6">Buy Sell Trade</h1>

    <!-- Login/Register Form -->
    <div id="auth-section" class="mb-6">
      <input id="username" type="text" placeholder="Username" class="input" />
      <input id="email" type="email" placeholder="Email" class="input" />
      <input id="password" type="password" placeholder="Password" class="input" />
      <div class="flex gap-2 mt-2">
        <button onclick="register()" class="btn">Register</button>
        <button onclick="login()" class="btn">Login</button>
        <button onclick="logout()" class="btn bg-red-500">Logout</button>
      </div>
      <p id="current-user" class="mt-2 text-sm text-gray-600"></p>
    </div>

    <!-- Add Item Form -->
    <div id="add-item-section" class="mb-6">
      <h2 class="text-xl font-semibold">Add New Item</h2>
      <input id="item-title" type="text" placeholder="Title" class="input" />
      <input id="item-description" type="text" placeholder="Description" class="input" />
      <input id="item-price" type="number" placeholder="Price" class="input" />
      <input id="item-image" type="text" placeholder="Image URL (optional)" class="input" />
      <button onclick="addItem()" class="btn mt-2">Post Item</button>
    </div>

    <!-- Item Listings -->
    <div id="items-list">
      <h2 class="text-xl font-semibold mb-4">All Items</h2>
      <ul id="items" class="space-y-4"></ul>
    </div>
  </div>

  <style>
    .input { display: block; margin: 0.5rem 0; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; width: 100%; max-width: 400px; }
    .btn { padding: 0.5rem 1rem; background: #3b82f6; color: white; border-radius: 6px; cursor: pointer; }
  </style>
</body>
</html>
